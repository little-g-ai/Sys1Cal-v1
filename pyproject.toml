[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-prob-bench"
version = "0.1.0"
description = "Procedural probability-recovery benchmark for black-box decision models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
plots = ["matplotlib>=3.7"]
yaml = ["PyYAML>=6"]

[project.scripts]
jev-prob-bench = "jev_prob_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
